<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lerílio — Emergência</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF9FE}
a{color:#3A2A78}a:hover{color:#24203A}
</style>

<div class="tela" style="margin: 0 auto; max-width: 100%; width: 390px; min-height: 844px; height: auto; box-sizing: border-box; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 20px; background: #FDF1F1; font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: #24203A">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.html" style="display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px 0 10px; border-radius: 24px; background: #EEE8FA; color: #3A2A78; font-size: 18px; font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Voltar</a>
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 2px solid #5B3FB0; border-radius: 24px; background: #FFFFFF; color: #3A2A78; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>Ouvir</button>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; margin-top: 8px">
<div style="width: 112px; height: 112px; border-radius: 56px; background: #B91C1C; display: flex; align-items: center; justify-content: center">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"></path></svg>
</div>
<h1 style="margin: 0; font-size: 32px; font-weight: 800; line-height: 1.2">Quer que eu ligue para Ana?</h1>
<p style="margin: 0; font-size: 20px; color: #4A4660">Contato de emergência · [telefone]</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; margin-top: auto">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 76px; border: 0; border-radius: 20px; background: #B91C1C; color: #FFFFFF; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 27px; font-weight: 800; cursor: pointer"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"></path></svg>Ligar</button>
<a href="Main.html" style="display: flex; align-items: center; justify-content: center; min-height: 68px; border-radius: 20px; border: 2px solid #24203A; background: #FFFFFF; color: #24203A; font-size: 23px; font-weight: 800; text-decoration: none">Cancelar</a>
<div style="display: flex; align-items: center; gap: 12px; margin: 4px 0"><span style="flex: 1; height: 2px; background: #E5C9C9"></span><span style="font-size: 17px; color: #4A4660">ou</span><span style="flex: 1; height: 2px; background: #E5C9C9"></span></div>
<button type="button" style="display: flex; align-items: center; justify-content: center; min-height: 64px; border: 3px solid #B91C1C; border-radius: 20px; background: #FFFFFF; color: #991B1B; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 22px; font-weight: 800; cursor: pointer">Ligar para o SAMU (192)</button>
</div>
</div>


<script>
// Protótipo do Lerílio — © 2026 Dalila Cristina Ferreira. Todos os direitos reservados.
// Faz o botão Ouvir ler a tela em voz alta.
document.querySelectorAll('button').forEach(function (b) {
  if (b.textContent.indexOf('Ouvir') === -1) return;
  b.addEventListener('click', function () {
    if (!('speechSynthesis' in window)) return;
    var s = window.speechSynthesis;
    if (s.speaking) { s.cancel(); return; }
    var texto = document.querySelector('.tela').innerText.replace(/Voltar|Ouvir de novo|Ouvir o termo|Ouvir/g, '');
    var f = new SpeechSynthesisUtterance(texto);
    f.lang = 'pt-BR'; f.rate = 0.9;
    setTimeout(function () { s.resume(); s.speak(f); }, 150);
  });
});
</script>
</body>
</html>
