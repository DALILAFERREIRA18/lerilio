<!doctype html>

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lerílio — Ajustes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF9FE}
a{color:#3A2A78}a:hover{color:#24203A}
</style>

<div class="tela" style="margin: 0 auto; max-width: 100%; width: 390px; min-height: 844px; height: auto; box-sizing: border-box; padding: 24px 20px 24px; display: flex; flex-direction: column; gap: 14px; background: #FBF9FE; font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: #24203A">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.html" style="display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px 0 10px; border-radius: 24px; background: #EEE8FA; color: #3A2A78; font-size: 18px; font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Voltar</a>
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 2px solid #5B3FB0; border-radius: 24px; background: #FFFFFF; color: #3A2A78; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>Ouvir</button>
</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 800">Ajustes</h1>
<section style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 2px solid #D9D3E8">
<h2 style="margin: 0; font-size: 21px; font-weight: 800">Tamanho da letra</h2>
<p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #F3F0FA; font-size: 23px; font-weight: 700">Remédio de teste A, 20 horas</p>
<div style="display: flex; gap: 12px; align-items: center">
<button type="button" aria-label="Diminuir a letra" style="width: 64px; min-height: 56px; border: 2px solid #4A4660; border-radius: 14px; background: #FFFFFF; color: #24203A; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 20px; font-weight: 800; cursor: pointer">A−</button>
<button type="button" aria-label="Aumentar a letra" style="width: 64px; min-height: 56px; border: 2px solid #4A4660; border-radius: 14px; background: #FFFFFF; color: #24203A; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 26px; font-weight: 800; cursor: pointer">A+</button>
<button type="button" style="margin-left: auto; min-height: 48px; padding: 0 12px; border: 0; background: none; color: #3A2A78; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 18px; font-weight: 700; text-decoration: underline; cursor: pointer">Restaurar</button>
</div>
</section>
<section style="display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 2px solid #D9D3E8">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 21px; font-weight: 800">Voz automática do aviso</h2><p style="margin: 0; font-size: 17px; color: #4A4660">Desligue se você usa leitor de tela.</p></div>
<button type="button" role="switch" aria-checked="true" aria-label="Voz automática do aviso" style="flex-shrink: 0; width: 72px; height: 44px; padding: 4px; border: 0; border-radius: 22px; background: #2E7D4F; display: flex; justify-content: flex-end; align-items: center; cursor: pointer"><span style="width: 36px; height: 36px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 12px; font-weight: 800; color: #1F5E3A">SIM</span></button>
</section>
<section style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 2px solid #D9D3E8">
<h2 style="margin: 0; font-size: 21px; font-weight: 800">Contato de emergência</h2>
<p style="margin: 0; font-size: 20px">Ana · [telefone]</p>
<button type="button" style="min-height: 56px; border: 2px solid #4A4660; border-radius: 14px; background: #FFFFFF; color: #24203A; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 19px; font-weight: 700; cursor: pointer">Mudar contato</button>
</section>
<section style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border: 2px solid #4B5563; border-radius: 16px; background: #FFFFFF; color: #24203A; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 20px; font-weight: 800; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"></path></svg>Apagar meus dados</button>
<p style="margin: 0; font-size: 16px; line-height: 1.4; color: #4A4660; text-align: center">Apaga tudo deste celular, com confirmação antes.</p>
</section>
</div>


<script>
// Protótipo do Lerílio — © 2026 Dalila Cristina Ferreira. Todos os direitos reservados.
// Faz o botão Ouvir ler a tela em voz alta.
document.querySelectorAll('button').forEach(function (b) {
  if (b.textContent.indexOf('Ouvir') === -1) return;
  b.addEventListener('click', function () {
    if (!('speechSynthesis' in window)) return;
    var s = window.speechSynthesis;
    if (s.speaking) { s.cancel(); return; }
    var texto = document.querySelector('.tela').innerText.replace(/Voltar|Ouvir de novo|Ouvir o termo|Ouvir/g, '');
    var f = new SpeechSynthesisUtterance(texto);
    f.lang = 'pt-BR'; f.rate = 0.9;
    setTimeout(function () { s.resume(); s.speak(f); }, 150);
  });
});
</script>
</body>
</html>
