<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 2px solid #5B3FB0; border-radius: 24px; background: #FFFFFF; color: #3A2A78; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>Ouvir</button>
</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 800">Próximas consultas</h1>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 2px solid #B9CFEA">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2563A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="4" y="5.5" width="16" height="15" rx="2.5"></rect><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 21px; font-weight: 800">Clínica geral</span><span style="font-size: 19px; font-weight: 700">12 de janeiro, 10 horas</span><span style="font-size: 17px; color: #4A4660">[Local de teste]</span></div>
</div>
<div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 2px solid #B9CFEA">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2563A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="4" y="5.5" width="16" height="15" rx="2.5"></rect><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 21px; font-weight: 800">Oftalmologia</span><span style="font-size: 19px; font-weight: 700">3 de fevereiro, 14 horas</span><span style="font-size: 17px; color: #4A4660">[Local de teste]</span></div>
</div>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 18px; border: 2px solid #4A4660; border-radius: 16px; background: #FFFFFF; color: #24203A; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 19px; font-weight: 700; cursor: pointer">Consultas anteriores (1)<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; margin-top: auto; border: 0; border-radius: 18px; background: #5B3FB0; color: #FFFFFF; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 23px; font-weight: 800; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Adicionar consulta</button>
</div>


<script>
// Protótipo do Lerílio — © 2026 Dalila Cristina Ferreira. Todos os direitos reservados.
// Faz o botão Ouvir ler a tela em voz alta.
document.querySelectorAll('button').forEach(function (b) {
  if (b.textContent.indexOf('Ouvir') === -1) return;
  b.addEventListener('click', function () {
    if (!('speechSynthesis' in window)) return;
    var s = window.speechSynthesis;
    if (s.speaking) { s.cancel(); return; }
    var texto = document.querySelector('.tela').innerText.replace(/Voltar|Ouvir de novo|Ouvir o termo|Ouvir/g, '');
    var f = new SpeechSynthesisUtterance(texto);
    f.lang = 'pt-BR'; f.rate = 0.9;
    setTimeout(function () { s.resume(); s.speak(f); }, 150);
  });
});
</script>
</body>
