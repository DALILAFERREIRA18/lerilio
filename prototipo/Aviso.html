<!doctype html>

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lerílio — Aviso de remédio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF9FE}
a{color:#3A2A78}a:hover{color:#24203A}
</style>

<div class="tela" style="margin: 0 auto; max-width: 100%; width: 390px; min-height: 844px; height: auto; box-sizing: border-box; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 20px; background: #FDF3D6; font-family: 'Nunito', 'Trebuchet MS', sans-serif; color: #24203A">
<div style="display: flex; justify-content: flex-end">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 2px solid #5B3FB0; border-radius: 24px; background: #FFFFFF; color: #3A2A78; font-family: 'Nunito', 'Trebuchet MS', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>Ouvir de novo</button>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; margin-top: 24px">
<div style="width: 150px; height: 150px; border-radius: 24px; background: #FFFFFF; border: 4px solid #C99A1E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#7A5A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(-35 12 12)"><rect x="3" y="8.5" width="18" height="7" rx="3.5"></rect><path d="M12 8.5v7"></path></g></svg>
<span style="font-size: 14px; color: #4A4660">[Foto da caixa]</span>
</div>
<h1 style="margin: 0; font-size: 34px; font-weight: 800; line-height: 1.15">Hora do remédio</h1>
<p style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3">Remédio de teste A<br>20 horas</p>
<p style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; background: #FFFFFF; font-size: 18px; font-weight: 700; color: #3A2A78"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>A Leri está falando o aviso</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; margin-top: auto">
<a href="Main.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 76px; border-radius: 20px; background: #2E7D4F; color: #FFFFFF; font-size: 27px; font-weight: 800; text-decoration: none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Já tomei</a>
<a href="Main.html" style="display: flex; align-items: center; justify-content: center; min-height: 68px; border-radius: 20px; border: 2px solid #24203A; background: #FFFFFF; color: #24203A; font-size: 23px; font-weight: 800; text-decoration: none">Lembrar mais tarde</a>
<p style="margin: 0; text-align: center; font-size: 17px; color: #4A4660">“Lembrar mais tarde” avisa de novo em 10 minutos.</p>
</div>
</div>


<script>
// Protótipo do Lerílio — © 2026 Dalila Cristina Ferreira. Todos os direitos reservados.
// Faz o botão Ouvir ler a tela em voz alta.
document.querySelectorAll('button').forEach(function (b) {
  if (b.textContent.indexOf('Ouvir') === -1) return;
  b.addEventListener('click', function () {
    if (!('speechSynthesis' in window)) return;
    var s = window.speechSynthesis;
    if (s.speaking) { s.cancel(); return; }
    var texto = document.querySelector('.tela').innerText.replace(/Voltar|Ouvir de novo|Ouvir o termo|Ouvir/g, '');
    var f = new SpeechSynthesisUtterance(texto);
    f.lang = 'pt-BR'; f.rate = 0.9;
    setTimeout(function () { s.resume(); s.speak(f); }, 150);
  });
});
</script>
</body>
</html>
