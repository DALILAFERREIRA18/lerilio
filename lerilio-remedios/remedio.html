<!doctype html>

<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remédio — Lerílio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="tela">
    <header class="topo"><a id="voltar" href="remedios.html" class="botao-voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Voltar</a><button id="ouvir" type="button" class="botao-ouvir"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>Ouvir</button></header>
    <form id="formulario" novalidate style="display: flex; flex-direction: column; gap: 20px; flex: 1">
      <div id="leitura" style="display: flex; flex-direction: column; gap: 20px">
        <h1 id="titulo">Novo remédio</h1>
        <div class="campo">
          <label for="nome">Nome do remédio</label>
          <input id="nome" type="text" maxlength="40" autocomplete="off" placeholder="Ex.: Remédio de teste A" aria-describedby="erro-nome dica-nome">
          <p id="erro-nome" class="erro" aria-live="polite"></p>
          <p id="dica-nome" class="apoio" style="display: flex; align-items: center; gap: 8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>Pode falar: toque no microfone do teclado.</p>
        </div>
        <div class="campo">
          <label for="horario">Horário</label>
          <input id="horario" type="time" aria-describedby="erro-horario">
          <p id="erro-horario" class="erro" aria-live="polite"></p>
        </div>
        <div class="campo">
          <img id="previa" class="foto-previa" alt="Foto da caixa do remédio" hidden>
          <input id="foto" type="file" accept="image/*" capture="environment" class="visualmente-oculto">
          <label for="foto" class="botao-foto"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="texto-foto">Foto da caixa (opcional)</span></label>
          <button id="remover-foto" type="button" class="botao botao-contorno botao-pequeno" hidden>Remover a foto</button>
        </div>
        <div id="repetido" class="aviso-repetido" role="alert" hidden></div>
        <p class="apoio">Nos testes, use nomes fictícios, como “Remédio de teste A”.</p>
      </div>
      <div class="acoes">
        <button type="submit" class="botao">Salvar</button>
        <button id="cancelar" type="button" class="botao botao-contorno">Cancelar</button>
        <button id="excluir" type="button" class="botao botao-cinza" hidden>Excluir este remédio</button>
      </div>
    </form>
  </main>
  <script type="module" src="js/pagina-remedio.js"></script>
</body>
</html>
